<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>मेरी उधार-बाकी डायरी | जयदेव सिंह</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json?v=10">
  <meta name="theme-color" content="#2a0808">
  <link rel="icon" type="image/png" href="/icons/favicon.png?v=10">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="उधार डायरी">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css?v=10">

  <style>
    /* Attractive first-paint splash (visible before React mounts) */
    html, body { margin: 0; padding: 0; }
    .splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
      background:
        radial-gradient(600px 340px at 15% 0%, rgba(245, 158, 11, 0.18), transparent 62%),
        radial-gradient(560px 360px at 100% 100%, rgba(225, 29, 72, 0.22), transparent 62%),
        linear-gradient(150deg, #1a0505 0%, #3b0d0d 55%, #5b1010 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }
    .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #78350f;
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 48%, #d97706 100%);
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 18px 34px -14px rgba(245, 158, 11, 0.8);
      margin-bottom: 12px;
      animation: splash-float 2.4s ease-in-out infinite;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .splash-sub {
      font-size: 12.5px;
      color: #a1938f;
      margin-top: 2px;
    }
    .splash-loader {
      margin-top: 20px;
      width: 132px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .splash-loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #fbbf24, #fda4af);
      animation: splash-slide 1.15s ease-in-out infinite;
    }
    @keyframes splash-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes splash-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-loader::after { animation: none; }
    }
  </style>
</head>
<body>

  <!-- React 18 Application Root Mount -->
  <div id="root">
    <div class="splash">
      <div class="splash-logo">₹</div>
      <div class="splash-title">मेरी उधार-बाकी डायरी</div>
      <div class="splash-sub">जयदेव सिंह • आपका हिसाब, हमेशा सुरक्षित</div>
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- Offline Standalone React 18 Libraries (No Internet or CDN Required) -->
  <script src="/js/libs/react.min.js?v=10"></script>
  <script src="/js/libs/react-dom.min.js?v=10"></script>
  <script src="/js/libs/babel.min.js?v=10"></script>

  <!-- Business Logic Engines -->
  <script src="/js/interest.js?v=10"></script>
  <script src="/js/whatsapp.js?v=10"></script>
  <script src="/js/storage.js?v=10"></script>

  <!-- React 18 Application Script -->
  <script type="text/babel" src="/js/react-app.jsx?v=10"></script>

  <!-- Service Worker Registration for PWA Offline Functionality -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=10')
          .then(reg => {
            console.log('React 18 PWA ServiceWorker Registered:', reg.scope);
            reg.update();
          })
          .catch(err => console.warn('ServiceWorker registration skipped:', err));
      });
    }
  </script>

</body>
</html>
